name: List third-party dependencies and check vulnerabilities

on:
  push:
    paths:
      - "third_party/**"
      - ".github/workflows/syft.yml"
  pull_request:
    paths:
      - "third_party/**"
      - ".github/workflows/syft.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Print declared dependency inventory
        run: jq -r '.components[] | "\(.name) \(.version)"' third_party/bom.json

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.7.1
        run: |
          set -euo pipefail
          base_url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL "${base_url}/osv-scanner_linux_amd64" -o osv-scanner_linux_amd64
          curl -fsSL "${base_url}/osv-scanner_SHA256SUMS" -o osv-scanner_SHA256SUMS
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check
          chmod +x osv-scanner_linux_amd64
          sudo install osv-scanner_linux_amd64 /usr/local/bin/osv-scanner

      - name: Scan SBOM for vulnerabilities
        id: osv
        shell: bash
        run: |
          set +e
          osv-scanner scan source --format json --lockfile=third_party/bom.json > osv-results.json
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "OSV-Scanner failed with exit code $scan_status" >&2
            exit "$scan_status"
          fi

      - name: Create two-column report and CSV
        if: always() && steps.osv.outcome == 'success'
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("osv-results.json").read_text())
          rows = []
          seen = set()

          for result in data.get("results", []):
              source = result.get("source", {}).get("path", "third_party/bom.json")
              for item in result.get("packages", []):
                  package = item.get("package", {})
                  name = package.get("name", "unknown")
                  version = package.get("version", "unknown")
                  ecosystem = package.get("ecosystem", "")
                  dependency = f"{name}@{version}"
                  if ecosystem:
                      dependency += f" ({ecosystem})"

                  for vuln in item.get("vulnerabilities", []):
                      ids = [vuln.get("id", "")]
                      ids.extend(vuln.get("aliases", []))
                      ids = list(dict.fromkeys(i for i in ids if i))
                      key = (name, version, tuple(sorted(ids)), source)
                      if key in seen:
                          continue
                      seen.add(key)
                      summary = vuln.get("summary") or vuln.get("details", "")
                      rows.append({
                          "dependency": dependency,
                          "vulnerability": ", ".join(ids) + (f" — {summary}" if summary else ""),
                          "version": version,
                          "vulnerability_ids": "; ".join(ids),
                          "summary": summary,
                          "source": source,
                      })

          with open("third-party-vulnerabilities.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=["dependency", "version", "vulnerability_ids", "summary", "source"])
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row[key] for key in writer.fieldnames})

          lines = ["## Third-party vulnerability findings", "", "| Dependency | Vulnerabilities |", "| --- | --- |"]
          if rows:
              for row in rows:
                  finding = row["vulnerability"].replace("|", "\\|").replace("\n", " ")
                  lines.append(f"| {row['dependency']} | {finding} |")
          else:
              lines.append("| No vulnerabilities reported | OSV-Scanner found no matching findings in the SBOM. |")
          lines.extend(["", f"CSV report: `third-party-vulnerabilities.csv` ({len(rows)} finding(s))."])

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as f:
                  f.write("\\n".join(lines) + "\\n")
          print("\\n".join(lines))
          PY

      - name: Upload vulnerability CSV
        if: always() && steps.osv.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-vulnerability-report
          path: third-party-vulnerabilities.csv
          if-no-files-found: warn
      
                  const escapeCell = value =>
              String(value).replaceAll('|', '\\|').replaceAll('\n', ' ');

            const title = 'OSV: third-party dependency vulnerabilities detected';
            const prefix = [
              'OSV-Scanner reported vulnerabilities in the declared third-party SBOM.',
              '',
              '> This issue shows findings that fit within GitHub’s issue-body limit. See the workflow artifact for the full CSV report.',
              '',
              '| Dependency | Vulnerability | Summary |',
              '| --- | --- | --- |',
            ].join('\n');

            const footer = [
              '',
              `Detected by [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            const maxBodyBytes = 60000;
            const included = [];
            let omitted = 0;

            for (const row of rows) {
              // Bound individual cells so one exceptionally long advisory can't consume the issue.
              const line = `| ${escapeCell(row.dependency).slice(0, 300)} | ${escapeCell(row.ids).slice(0, 500)} | ${escapeCell(row.summary).slice(0, 500)} |`;
              const candidate = [
                prefix,
                ...included,
                line,
                '',
                '_Additional findings omitted from this issue; see the workflow CSV artifact._',
                footer,
              ].join('\n');

              if (Buffer.byteLength(candidate, 'utf8') > maxBodyBytes) {
                omitted = rows.length - included.length;
                break;
              }
              included.push(line);
            }

            const omittedLine = omitted
              ? `\n\n_${omitted} additional finding(s) omitted; see the workflow CSV artifact._`
              : '';

            const body = `${prefix}\n${included.join('\n')}${omittedLine}${footer}`;

            if (Buffer.byteLength(body, 'utf8') > 65536) {
              throw new Error('Generated issue body still exceeds GitHub’s 65,536-byte limit.');
            }