name: List third-party dependencies

on:
  push:
    paths:
      - "third_party/**"
      - ".github/workflows/syft.yml"
  pull_request:
    paths:
      - "third_party/**"
      - ".github/workflows/syft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
      
      - name: Print declared dependency inventory
        run: |
          jq -r '.components[] | "\(.name) \(.version)"' third_party/bom.json

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.7.1
        run: |
          set -euo pipefail
          base_url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL "${base_url}/osv-scanner_linux_amd64" -o osv-scanner
          curl -fsSL "${base_url}/osv-scanner_SHA256SUMS" -o osv-scanner_SHA256SUMS
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check
          chmod +x osv-scanner
          sudo install osv-scanner /usr/local/bin/osv-scanner

      - name: Check declared dependencies for vulnerabilities
        run: osv-scanner scan source --lockfile=third_party/bom.json
